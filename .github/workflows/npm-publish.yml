name: Publish to npm

on:
  push:
    branches:
      - master
    paths:
      - 'mem0-ts/**'
      - '.github/workflows/npm-publish.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'mem0-ts/**'
      - '.github/workflows/npm-publish.yml'
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish even if version check fails'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: Build & Test TypeScript SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: 'mem0-ts/pnpm-lock.yaml'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mem0-ts

      - name: Build TypeScript bundle
        run: pnpm run build
        working-directory: mem0-ts

  publish:
    name: Publish @laidon/mem0 to npm
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC) & provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'
          cache-dependency-path: 'mem0-ts/pnpm-lock.yaml'

      - name: Upgrade npm to latest for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: mem0-ts

      - name: Build TypeScript bundle
        run: pnpm run build
        working-directory: mem0-ts

      - name: Check whether version is already published
        id: publish_check
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          echo "Checking if ${package_name}@${package_version} is already on npm..."
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "Version ${package_version} is already published on npm. Skipping publish."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "Version ${package_version} is not yet published. Proceeding to publish."
          fi
        working-directory: mem0-ts

      - name: Publish to npm
        if: steps.publish_check.outputs.should_publish == 'true' || inputs.force_publish == true
        run: npm publish --provenance --access public
        working-directory: mem0-ts
